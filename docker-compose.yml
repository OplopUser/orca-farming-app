services:
  orca-bot:
    image: ghcr.io/oplopuser/orca-farming-app:latest
    container_name: orca-bot
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    environment:
      # The panel binds to 127.0.0.1 by default; inside the container it must listen on all interfaces
      # for the published port to work. Set UI_TOKEN in .env, or publish as "127.0.0.1:8787:8787".
      - UI_HOST=0.0.0.0
    volumes:
      - ./data:/app/data
      - ./wallet.json:/app/wallet.json:ro

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro
